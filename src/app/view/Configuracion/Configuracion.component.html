<div class="main-container" [ngClass]="{'with-sidebar': !isSidebarReduced,'without-sidebar': isSidebarReduced}">

  <ul class="nav nav-tabs">
    <li class="nav-item">
      <a class="nav-link active" data-bs-toggle="tab" href="#content1">Códigos DANE</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" data-bs-toggle="tab" href="#content2">Roles y Permisos</a>
    </li>
  </ul>

  <div class="tab-content">
    <div class="tab-pane fade show active" id="content1">
      <div class="container my-4">
        <h4 class=" title mb-4">Crear Códigos DANE</h4>

        <!-- Selector principal -->
        <div class="row mb-4">
          <div class="col-md-6">
            <select class="form-select" [(ngModel)]="tipoSeleccionado">
              <option value="">Selecciona qué deseas crear</option>
              <option value="seccion">Sección</option>
              <option value="division">División</option>
              <option value="grupo">Grupo</option>
              <option value="clase">Clase</option>
              <option value="subclase">Subclase</option>
              <option value="unidad">Unidad de Medida</option>
            </select>
          </div>
        </div>

        <div *ngIf="tipoSeleccionado" class="card p-4">
          <div class="d-flex align-items-center gap-3 flex-wrap">

            <div class="fw-bold">
              {{ obtenerTitulo(tipoSeleccionado) }}
            </div>


            <div *ngIf="tipoSeleccionado !== 'seccion' && tipoSeleccionado !== 'unidad'">
              <select class="form-select" [(ngModel)]="selectedSeccion">
                <option value="">Seleccionar Sección</option>
                <option *ngFor="let s of secciones" [value]="s.codigo">{{ s.descripcion }}</option>
              </select>
            </div>

            <div *ngIf="['grupo', 'clase', 'subclase'].includes(tipoSeleccionado)">
              <select class="form-select" [(ngModel)]="selectedDivision">
                <option value="">Seleccionar División</option>
                <option *ngFor="let d of divisiones" [value]="d.codigo">{{ d.descripcion }}</option>
              </select>
            </div>

            <div *ngIf="['clase', 'subclase'].includes(tipoSeleccionado)">
              <select class="form-select" [(ngModel)]="selectedGrupo">
                <option value="">Seleccionar Grupo</option>
                <option *ngFor="let g of grupos" [value]="g.codigo">{{ g.descripcion }}</option>
              </select>
            </div>

            <div *ngIf="['subclase'].includes(tipoSeleccionado)">
              <select class="form-select" [(ngModel)]="selectedClase">
                <option value="">Seleccionar Clase</option>
                <option *ngFor="let c of clases" [value]="c.codigo">{{ c.descripcion }}</option>
              </select>
            </div>

            <div *ngIf="tipoSeleccionado === 'subclase'">
              <select class="form-select" [(ngModel)]="selectedUnidad">
                <option value="">Seleccionar Unidad de Medida</option>
                <option value="kg">Kilogramo (kg)</option>
                <option value="g">Gramo (g)</option>
                <option value="l">Litro (l)</option>
                <option value="m">Metro (m)</option>
                <option value="un">Unidad (un)</option>
                <option value="par">Par</option>
                <option value="jgo">Juego</option>
              </select>
            </div>


            <input type="number" class="form-control" style="max-width: 120px;" placeholder="Código" [(ngModel)]="codigoInput" *ngIf="tipoSeleccionado !== 'unidad'">

            <input type="text" class="form-control" style="max-width: 120px;" placeholder="Código" [(ngModel)]="codigoInput" *ngIf="tipoSeleccionado === 'unidad'">
            <input type="text" class="form-control" style="max-width: 250px;" placeholder="Descripción" [(ngModel)]="descripcionInput">

            <button class="btn btn-success" (click)="crearItem()">Crear</button>

          </div>
        </div>

        <div class="card mt-4 p-3">
          <h5>Historial de Códigos</h5>
        
          <ng-container *ngIf="historial.length > 0; else sinCodigos">
            <div *ngFor="let item of historialPaginado" [ngStyle]="{ 'margin-left': getIndentacion(item.tipo) + 'rem' }" class="historial-item">
              <span class="historial-tipo">
                {{ item.tipo | titlecase }}:
              </span> 
              <span class="historial-codigo">
                {{ item.codigo }}
              </span> 
              <span class="historial-descripcion">
                {{ item.descripcion }}
              </span>
            </div>
          </ng-container>
        
          <ng-template #sinCodigos>
            <p class="text-muted">No contiene códigos creados todavía.</p>
          </ng-template>
        
        </div>
        <nav *ngIf="totalPaginas > 1" aria-label="Historial de Códigos" class="mt-4">
          <ul class="pagination justify-content-center">
            <li class="page-item" [class.disabled]="historialPaginaActual === 1">
              <button class="page-link" (click)="anteriorPagina()" [disabled]="historialPaginaActual === 1">Anterior</button>
            </li>
        
            <li 
              class="page-item" 
              *ngFor="let pagina of paginasArray()" 
              [class.active]="pagina === historialPaginaActual">
              <button class="page-link" (click)="irAPagina(pagina)">
                {{ pagina }}
              </button>
            </li>
        
            <li class="page-item" [class.disabled]="historialPaginaActual === totalPaginas">
              <button class="page-link" (click)="siguientePagina()" [disabled]="historialPaginaActual === totalPaginas">Siguiente</button>
            </li>
          </ul>
        </nav>
        
        
      </div>
      <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1100;">
        <div 
          class="toast align-items-center text-white bg-danger border-0" 
          role="alert" 
          aria-live="assertive" 
          aria-atomic="true"
          id="toastAlerta">
          <div class="d-flex">
            <div class="toast-body">
              {{ mensajeToast }}
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" (click)="cerrarToast()" aria-label="Close"></button>
          </div>
        </div>
      </div>
      
    </div>
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1100;">
      <div 
        class="toast align-items-center text-white bg-success border-0 show" 
        *ngIf="mostrarToastExito"
        role="alert" 
        aria-live="assertive" 
        aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body">
            <i class="bi bi-check-circle-fill me-2"></i> {{ mensajeToastExito }}

          </div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" (click)="cerrarToastExito()" aria-label="Close"></button>
        </div>
      </div>
    </div>
    
    <!-- Contenido Tab 2: Roles y Permisos -->
    <div class="tab-pane fade" id="content2">
      <app-RolesPermisos></app-RolesPermisos>
    </div>
  </div>

</div>
